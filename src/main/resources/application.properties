spring.application.name=budget

# MySQL 연결 (비밀번호는 본인 것으로 바꾸기)
spring.datasource.url=jdbc:mysql://localhost:3306/budget_erp?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=비밀번호

# MyBatis: SQL XML 위치, budget_id 같은 컬럼명을 budgetId 필드에 자동 연결
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 실행되는 SQL을 콘솔에 출력 (공부용)
logging.level.com.example.budget.mapper=DEBUG
